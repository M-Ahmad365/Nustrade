<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Listings — NusTrade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="mainDrawer" aria-label="Main menu">
  <div class="drawer-header">
    <span class="navbar-logo"><span class="navbar-logo-mark">N</span> NusTrade</span>
    <button class="btn-icon drawer-close" aria-label="Close menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <nav class="drawer-nav">
    <a href="/index.html">Home</a>
    <a href="/pages/my-listings.html" class="active">My Listings</a>
    <a href="/pages/my-offers.html">My Offers</a>
    <a href="/pages/wishlist.html">Saved</a>
    <a href="/pages/chat.html">Messages</a>
    <a href="/pages/transactions.html">Transactions</a>
    <a href="/pages/notifications.html">Notifications</a>
    <a href="/pages/profile.html">Profile</a>
  </nav>
</aside>

<header class="navbar" id="navbar">
  <div class="container navbar-inner">
    <a href="/index.html" class="navbar-logo"><span class="navbar-logo-mark">N</span> NusTrade</a>
    <nav class="navbar-links">
      <a href="/index.html">Browse</a>
      <a href="/pages/my-listings.html" class="active">My Listings</a>
      <a href="/pages/my-offers.html">My Offers</a>
      <a href="/pages/transactions.html">Transactions</a>
    </nav>
    <div class="navbar-right" style="margin-left:auto;">
      <a href="/pages/create-listing.html" class="btn-post">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Post
      </a>
      <a href="/pages/notifications.html" class="btn-icon" aria-label="Notifications" id="navBellBtn" style="position:relative;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </a>
      <a href="/pages/profile.html" class="nav-avatar-btn" id="navAvatarBtn" aria-label="Profile">
        <div class="avatar-placeholder avatar-sm" id="navAvatarInitials">?</div>
      </a>
      <button class="btn-icon nav-menu-btn" aria-label="Open menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<main class="page">
  <div class="container main-content">

    <div class="section-header mb-6">
      <h1 style="font-size: var(--text-2xl); font-weight:600; letter-spacing:-0.3px;">My Listings</h1>
      <a href="/pages/create-listing.html" class="btn btn-primary btn-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Post new
      </a>
    </div>

    <!-- Status tabs -->
    <div style="display:flex; gap: 0; border-bottom: 1px solid var(--hairline-soft); margin-bottom: var(--space-6);">
      <button class="tab-btn active" data-status="active" style="padding: var(--space-3) var(--space-4); border:none; background:none; cursor:pointer; font-size: var(--text-base); font-weight:500; color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom:-1px;">Active</button>
      <button class="tab-btn" data-status="sold" style="padding: var(--space-3) var(--space-4); border:none; background:none; cursor:pointer; font-size: var(--text-base); font-weight:500; color: var(--steel); border-bottom: 2px solid transparent; margin-bottom:-1px;">Sold</button>
      <button class="tab-btn" data-status="expired" style="padding: var(--space-3) var(--space-4); border:none; background:none; cursor:pointer; font-size: var(--text-base); font-weight:500; color: var(--steel); border-bottom: 2px solid transparent; margin-bottom:-1px;">Expired</button>
    </div>

    <div class="listings-grid" id="myListingsGrid"></div>
    <div id="paginationBar" class="pagination"></div>

  </div>
</main>

<div id="toast-container"></div>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/router.js"></script>
<script src="../js/pages/my-listings.js"></script>
<div class="sunset-stripe"></div>
</body>
</html>
