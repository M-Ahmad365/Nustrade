<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NusTrade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body>

<div class="auth-page page">
  <div class="auth-card">

    <div class="auth-logo">
      <a href="/index.html" style="display:inline-flex; align-items:center; gap: var(--space-2); color:var(--ink); font-family: var(--font-display); font-weight:400; font-size:20px; text-decoration:none;">
        <span class="navbar-logo-mark">N</span>
        NusTrade
      </a>
    </div>

    <!-- Step 1: Enter email -->
    <div id="stepEmail">
      <h1 class="auth-title">Forgot password?</h1>
      <p class="auth-subtitle">Enter your NUST email — we'll send a reset code</p>

      <form class="auth-form" id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">NUST email</label>
          <input type="email" class="form-input" id="email" name="email" placeholder="you@nust.edu.pk" autocomplete="email" required>
          <span class="form-error" id="emailError" role="alert" style="display:none"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="sendOtpBtn">Send reset code</button>
        <div id="formError" class="form-error" role="alert" style="display:none; text-align:center;"></div>
      </form>
    </div>

    <!-- Step 2: Enter OTP + new password -->
    <div id="stepReset" style="display:none;">
      <h1 class="auth-title">Set new password</h1>
      <p class="auth-subtitle">Enter the code sent to your email and choose a new password</p>

      <form class="auth-form" id="resetForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="resetOtp">Verification code</label>
          <input type="text" class="form-input" id="resetOtp" name="otp" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required style="letter-spacing: 0.4em; text-align:center; font-size: var(--text-xl);">
          <span class="form-error" id="resetOtpError" role="alert" style="display:none"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="newPassword">New password</label>
          <input type="password" class="form-input" id="newPassword" name="newPassword" placeholder="At least 8 characters, 1 uppercase, 1 digit" autocomplete="new-password" required>
          <span class="form-error" id="newPasswordError" role="alert" style="display:none"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmNewPassword">Confirm new password</label>
          <input type="password" class="form-input" id="confirmNewPassword" name="confirmNewPassword" placeholder="Repeat password" autocomplete="new-password" required>
          <span class="form-error" id="confirmNewPasswordError" role="alert" style="display:none"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Reset password</button>
        <div id="resetFormError" class="form-error" role="alert" style="display:none; text-align:center;"></div>
      </form>
    </div>

    <p class="auth-footer" style="margin-top: var(--space-4);">
      <a href="/pages/login.html" class="font-500">Back to login</a>
    </p>

  </div>
</div>

<div id="toast-container"></div>

<script>
var API = 'http://localhost:4000/api/v1';

document.addEventListener('DOMContentLoaded', function() {
  console.log('[forgot-password] ready');

  var currentEmail = '';

  // Step 1: send reset code
  document.getElementById('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    var email     = document.getElementById('email').value.trim().toLowerCase();
    var emailErr  = document.getElementById('emailError');
    var formErr   = document.getElementById('formError');
    var sendBtn   = document.getElementById('sendOtpBtn');

    emailErr.style.display = 'none'; emailErr.textContent = '';
    formErr.style.display  = 'none'; formErr.textContent  = '';

    if (!email) {
      emailErr.textContent   = 'Email is required.';
      emailErr.style.display = '';
      return;
    }

    sendBtn.disabled    = true;
    sendBtn.textContent = 'Sending...';

    try {
      console.log('[forgot-password] calling API...');
      var res  = await fetch(API + '/auth/forgot-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email: email })
      });
      var json = await res.json();
      console.log('[forgot-password] API response:', json);

      // Always show step 2 — backend returns generic message regardless
      currentEmail = email;
      document.getElementById('stepEmail').style.display = 'none';
      document.getElementById('stepReset').style.display = '';
      document.getElementById('resetOtp').focus();

    } catch(err) {
      console.error('[forgot-password] fetch error:', err);
      formErr.textContent   = 'Cannot reach server. Is backend running on port 4000?';
      formErr.style.display = '';
    } finally {
      sendBtn.disabled    = false;
      sendBtn.textContent = 'Send reset code';
    }
  });

  // Step 2: reset password
  document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    var otp             = document.getElementById('resetOtp').value.trim();
    var newPassword     = document.getElementById('newPassword').value;
    var confirmPassword = document.getElementById('confirmNewPassword').value;
    var otpErr          = document.getElementById('resetOtpError');
    var passErr         = document.getElementById('newPasswordError');
    var confirmErr      = document.getElementById('confirmNewPasswordError');
    var resetFormErr    = document.getElementById('resetFormError');
    var resetBtn        = document.getElementById('resetBtn');

    otpErr.style.display       = 'none'; otpErr.textContent       = '';
    passErr.style.display      = 'none'; passErr.textContent      = '';
    confirmErr.style.display   = 'none'; confirmErr.textContent   = '';
    resetFormErr.style.display = 'none'; resetFormErr.textContent = '';

    var ok = true;
    if (!otp || otp.length !== 6)                        { otpErr.textContent = 'Enter the 6-digit code from your email.'; otpErr.style.display = ''; ok = false; }
    if (!newPassword)                                    { passErr.textContent = 'New password is required.'; passErr.style.display = ''; ok = false; }
    else if (!/^(?=.*[A-Z])(?=.*\d).{8,}$/.test(newPassword)) { passErr.textContent = 'Min 8 chars, 1 uppercase, 1 digit.'; passErr.style.display = ''; ok = false; }
    if (!confirmPassword)                                { confirmErr.textContent = 'Please confirm your password.'; confirmErr.style.display = ''; ok = false; }
    else if (newPassword !== confirmPassword)            { confirmErr.textContent = 'Passwords do not match.'; confirmErr.style.display = ''; ok = false; }
    if (!ok) return;

    resetBtn.disabled    = true;
    resetBtn.textContent = 'Resetting...';

    try {
      console.log('[forgot-password] resetting password...');
      var res  = await fetch(API + '/auth/reset-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email: currentEmail, otp: otp, new_password: newPassword })
      });
      var json = await res.json();
      console.log('[forgot-password] reset response:', json);

      if (json.success) {
        window.location.href = '/pages/login.html?email=' + encodeURIComponent(currentEmail);
      } else {
        var msg = (json.error && json.error.message) || 'Invalid or expired code.';
        resetFormErr.textContent   = msg;
        resetFormErr.style.display = '';
      }
    } catch(err) {
      console.error('[forgot-password] reset error:', err);
      resetFormErr.textContent   = 'Cannot reach server. Is backend running on port 4000?';
      resetFormErr.style.display = '';
    } finally {
      resetBtn.disabled    = false;
      resetBtn.textContent = 'Reset password';
    }
  });
});
</script>
<div class="sunset-stripe"></div>
</body>
</html>
