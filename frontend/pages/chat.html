<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — NusTrade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    /* Override chat-input to textarea */
    .chat-input {
      height: auto;
      min-height: 40px;
      max-height: 120px;
      padding: 9px 14px;
      resize: none;
      line-height: 1.4;
      overflow-y: auto;
    }
    /* Remove main page padding so chat fills viewport below navbar */
    .page { padding: 0; }
  </style>
</head>
<body>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="mainDrawer" aria-label="Main menu">
  <div class="drawer-header">
    <span class="navbar-logo"><span class="navbar-logo-mark">N</span> NusTrade</span>
    <button class="btn-icon drawer-close" aria-label="Close menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <nav class="drawer-nav">
    <a href="/index.html">Home</a>
    <a href="/pages/my-listings.html">My Listings</a>
    <a href="/pages/my-offers.html">My Offers</a>
    <a href="/pages/wishlist.html">Saved</a>
    <a href="/pages/chat.html" class="active">Messages</a>
    <a href="/pages/transactions.html">Transactions</a>
    <a href="/pages/notifications.html">Notifications</a>
    <a href="/pages/profile.html">Profile</a>
  </nav>
</aside>

<header class="navbar" id="navbar">
  <div class="container navbar-inner">
    <a href="/index.html" class="navbar-logo"><span class="navbar-logo-mark">N</span> NusTrade</a>
    <nav class="navbar-links">
      <a href="/index.html">Browse</a>
      <a href="/pages/my-listings.html">My Listings</a>
      <a href="/pages/chat.html" class="active">Messages</a>
      <a href="/pages/transactions.html">Transactions</a>
    </nav>
    <div class="navbar-right" style="margin-left:auto;">
      <a href="/pages/notifications.html" class="btn-icon" aria-label="Notifications" id="navBellBtn" style="position:relative;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </a>
      <a href="/pages/profile.html" class="nav-avatar-btn" id="navAvatarBtn" aria-label="Profile">
        <div class="avatar-placeholder avatar-sm" id="navAvatarInitials">?</div>
      </a>
      <button class="btn-icon nav-menu-btn" aria-label="Open menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<main class="page">
  <div class="chat-layout" id="chatLayout">

    <!-- Thread list -->
    <div class="chat-threads-col" id="threadsCol">
      <div style="padding: var(--space-4); border-bottom: 1px solid var(--hairline-soft);">
        <h2 style="font-size: var(--text-lg); font-weight:600;">Messages</h2>
      </div>

      <!-- Thread search -->
      <div style="padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--hairline-soft);">
        <div style="position:relative;">
          <svg style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color: var(--stone); pointer-events:none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" style="width:100%; height:36px; padding: 0 12px 0 34px; background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-full); font-size: var(--text-sm); outline:none;" placeholder="Search conversations…" id="threadSearch" aria-label="Search conversations">
        </div>
      </div>

      <div id="threadList" style="flex:1; overflow-y:auto;">
        <!-- Populated by chat.js -->
      </div>
    </div>

    <!-- Chat window -->
    <div class="chat-window-col" id="chatWindow" style="display:none;">

      <!-- Chat header -->
      <div class="chat-header" id="chatHeader">
        <button id="backToThreads" class="btn-icon" aria-label="Back to conversations" style="display:none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <img id="chatListingThumb" src="" alt="" loading="lazy" style="width:48px; height:48px; border-radius: var(--radius-md); object-fit:cover; background: var(--surface); display:none; flex-shrink:0;">
        <div style="flex:1; min-width:0;">
          <div id="chatOtherName" style="font-weight:500; font-size: var(--text-base); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;"></div>
          <div id="chatListingTitle" style="font-size: var(--text-sm); color: var(--steel); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;"></div>
        </div>
        <div id="chatListingPrice" style="font-size: var(--text-base); font-weight:500; color: var(--primary); flex-shrink:0;"></div>
      </div>

      <!-- Messages -->
      <div class="chat-messages" id="messagesContainer" aria-live="polite" aria-label="Messages">
        <!-- Populated by chat.js -->
      </div>

      <!-- Input bar -->
      <div class="chat-input-bar">
        <label for="imgUploadChat" class="btn-icon" style="cursor:pointer; color: var(--steel); flex-shrink:0;" aria-label="Send image" title="Send image">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </label>
        <input type="file" id="imgUploadChat" accept="image/jpeg,image/png,image/webp" style="display:none;">
        <textarea
          class="chat-input"
          id="messageInput"
          placeholder="Type a message…"
          autocomplete="off"
          aria-label="Message"
          maxlength="1000"
          rows="1"
        ></textarea>
        <button class="btn btn-primary btn-sm" id="sendBtn" aria-label="Send" style="flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>

    </div>

    <!-- Empty chat state (no thread selected) -->
    <div id="noChatSelected" class="empty-state" style="flex:1; display:flex;">
      <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <p class="empty-state-title">Select a conversation</p>
      <p class="empty-state-desc">Choose a thread on the left to start chatting.</p>
    </div>

  </div>
</main>

<div id="toast-container"></div>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/router.js"></script>
<script src="../js/pages/chat.js"></script>
<div class="sunset-stripe"></div>
</body>
</html>
